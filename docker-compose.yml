# Local development stack. Zero cost: everything runs on this machine.
# Ollama runs natively on macOS (Metal GPU) and is reached at localhost:11434.
name: opspilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5433:5432"   # 5432 is used by the host's Homebrew Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.7
    environment:
      SERVICES: s3,sqs,logs,cloudwatch
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      # the init script creates opspilot-evaluate last, so this means every queue exists
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name opspilot-evaluate >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---- application services (opt-in): docker compose --profile app up -d --build
  # Ollama stays on the host (Metal GPU); containers reach it via host.docker.internal.
  api:
    profiles: ["app"]
    build: {context: ., dockerfile: backend/Dockerfile}
    image: opspilot-backend:dev
    environment: &app-env
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      MCP_CLOUDWATCH_URL: http://mcp-cloudwatch:8101/mcp
      MCP_GITHUB_URL: http://mcp-github:8102/mcp
      CORS_ORIGINS: '["http://localhost:3000"]'
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8080:8000"]   # 8000 is left free for a locally run API
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]

  worker:
    profiles: ["app"]
    image: opspilot-backend:dev
    environment: *app-env
    command: ["python", "-m", "app.worker"]
    healthcheck: {disable: true}
    depends_on: [api]
    extra_hosts: ["host.docker.internal:host-gateway"]

  mcp-cloudwatch:
    profiles: ["app"]
    image: opspilot-backend:dev
    environment:
      <<: *app-env
      MCP_PORT: "8101"
      CW_ALLOWED_LOG_GROUPS: /ecs/orders-api
      CW_ALLOWED_NAMESPACES: OpsPilot/OrdersApi
    command: ["python", "-m", "mcp_servers.cloudwatch.server"]
    healthcheck: {disable: true}
    depends_on: [api]

  mcp-github:
    profiles: ["app"]
    image: opspilot-backend:dev
    # Only this service reads backend/.env: it holds GITHUB_TOKEN, which no other process may see.
    env_file: [{path: backend/.env, required: false}]
    environment:
      MCP_PORT: "8102"
    command: ["python", "-m", "mcp_servers.github.server"]
    healthcheck: {disable: true}
    depends_on: [api]

  # One-shot, idempotent: demo account, sample corpus, SYNTHETIC CloudWatch incident, CloudWatch
  # integration. Runs on every `up`; re-run with: docker compose --profile app run --rm seed
  seed:
    profiles: ["app"]
    image: opspilot-backend:dev
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      SEED_API_URL: http://api:8000
      SEED_S3_ENDPOINT: http://localstack:4566   # presigned URLs name localhost:4566, unreachable in here
      SEED_CORPUS_DIR: /evaluation/datasets/v1/corpus
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-}   # connect GitHub only when you set this
    command: ["python", "/app/scripts/seed_demo.py"]
    healthcheck: {disable: true}
    restart: "no"
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
      mcp-cloudwatch: {condition: service_started}

  # The browser calls the API on the host-published port, so the URL is baked in at build time.
  frontend:
    profiles: ["app"]
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    image: opspilot-frontend:dev
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
