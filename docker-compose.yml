# Local development stack. Zero cost: everything runs on this machine.
# Ollama runs natively on macOS (Metal GPU) and is reached at localhost:11434.
name: opspilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5433:5432"   # 5432 is used by the host's Homebrew Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.7
    environment:
      SERVICES: s3,sqs,logs,cloudwatch
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name opspilot-ingest >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
